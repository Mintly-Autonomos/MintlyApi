name: MintlyApi Deploy

# Deploy manual. O AMBIENTE decide a nuvem e a branch de código:
#   environment = staging    -> Vercel   (código da branch `staging`)
#   environment = production -> AWS EC2   (código da branch `main`)
# Não há input de nuvem: staging é sempre Vercel e production é sempre AWS,
# evitando combinações erradas (ex.: subir produção na Vercel por engano).
# Enquanto o AWS não estiver pronto, deploys de production vão falhar — esperado.
#
# A criação de índices roda DENTRO do job de deploy (após a aprovação do
# environment), então há uma única aprovação por deploy.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy (staging -> Vercel, production -> AWS)
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      confirm_deploy:
        description: Confirm that you want to run this deployment
        required: true
        default: false
        type: boolean

concurrency:
  group: mintlyapi-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify-inputs:
    name: Confirm deployment request
    runs-on: ubuntu-latest

    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm_deploy }}" != "true" ]; then
            echo "Deployment cancelled because confirm_deploy was not checked."
            exit 1
          fi

  deploy-vercel:
    name: Deploy to Vercel (staging)
    needs: verify-inputs
    if: ${{ inputs.environment == 'staging' }}
    runs-on: ubuntu-latest
    environment: staging

    env:
      API_URL: ${{ secrets.API_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Conexão pelos MESMOS campos que o app usa (buildMongoUri monta a URI
      # standard, sem SRV).
      MONGODB_HOSTS: ${{ secrets.MONGODB_HOSTS }}
      MONGODB_USER: ${{ secrets.MONGODB_USER }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      MONGODB_REPLICA_SET: ${{ secrets.MONGODB_REPLICA_SET }}
      MONGODB_AUTH_SOURCE: ${{ secrets.MONGODB_AUTH_SOURCE }}
      MONGODB_TLS: ${{ secrets.MONGODB_TLS }}
      MONGO_ENV: ${{ vars.MONGO_ENV || inputs.environment }}
      # E-mail de recuperação de senha (getEmailService: Gmail > console).
      # FRONTEND_URL é o domínio do MintlyWeb deployado — sem isso, o link do
      # e-mail aponta pro default de dev (localhost:4200).
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      # Allowlist do CORS (P4): CSV com as origens do MintlyWeb. SEM ela a
      # allowlist nasce vazia e o servidor NEGA toda origem de navegador — o
      # front perde a API. Por isso é REQUIRED no sync abaixo: falhar o deploy
      # é melhor do que derrubar o front silenciosamente.
      #
      # ATENÇÃO — a Vercel força NODE_ENV=production mesmo neste ambiente de
      # staging. Logo o atalho de localhost do `cors-origins.ts` (liberado só
      # fora de produção) NÃO vale contra a staging: para desenvolver o front
      # local apontando pra API de staging, inclua `http://localhost:4200` na
      # própria CORS_ORIGINS da staging.
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.11.0

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Validate Swagger
        run: npm run validate:swagger

      # Índices idempotentes antes do deploy (mesmo run/aprovação do deploy).
      - name: Ensure DB indexes
        run: npm run db:indices

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Empurra as envs do repo para as Environment Variables do projeto na
      # Vercel. Sem isso, o bloco `env:` acima só alcança os steps do runner
      # (ex.: db:indices) — o RUNTIME da função na Vercel lê apenas as vars do
      # projeto Vercel, e conexões caem em `bad auth` por senha ausente/vazia.
      # GitHub Secrets/Variables = única fonte de verdade; cada deploy re-sincroniza.
      #
      # A Vercel hospeda o ambiente de teste: usamos o slot "production" do
      # projeto Vercel (alias estável) como nosso staging.
      #
      # REQUIRED: envs sem default no código do app — se faltar, o deploy FALHA.
      # OPTIONAL: ausência é válida (MONGODB_TLS ausente => TLS habilitado no Atlas).
      # VERCEL_ORG_ID/VERCEL_PROJECT_ID ficam de fora: são config do CLI, não do app.
      - name: Sync runtime env vars to Vercel
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          TARGET=production

          REQUIRED="MONGODB_HOSTS MONGODB_USER MONGODB_PASSWORD MONGODB_REPLICA_SET MONGODB_AUTH_SOURCE"
          REQUIRED="$REQUIRED MONGO_ENV API_URL GMAIL_USER GMAIL_APP_PASSWORD EMAIL_FROM FRONTEND_URL"
          REQUIRED="$REQUIRED CORS_ORIGINS"
          OPTIONAL="MONGODB_TLS"

          MISSING=""
          for VAR in $REQUIRED; do
            if [ -z "${!VAR:-}" ]; then
              MISSING="$MISSING $VAR"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Envs obrigatorias ausentes (defina nos Secrets/Variables do repo):$MISSING"
            exit 1
          fi

          for VAR in $REQUIRED $OPTIONAL; do
            VALUE="${!VAR:-}"
            if [ -z "$VALUE" ]; then
              echo "skip $VAR (opcional, ausente)"
              continue
            fi
            vercel env rm "$VAR" "$TARGET" --yes --token="$TOKEN" 2>/dev/null || true
            printf '%s' "$VALUE" | vercel env add "$VAR" "$TARGET" --token="$TOKEN"
            echo "synced $VAR -> $TARGET"
          done

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-aws:
    name: Deploy to AWS EC2 (production)
    needs: verify-inputs
    if: ${{ inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    environment: production

    env:
      API_URL: ${{ secrets.API_URL }}
      AWS_EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
      AWS_EC2_USER: ${{ secrets.AWS_EC2_USER }}
      AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
      AWS_PROCESS_NAME: ${{ secrets.AWS_PROCESS_NAME }}
      # Conexão pelos MESMOS campos que o app usa (buildMongoUri monta a URI
      # standard, sem SRV).
      MONGODB_HOSTS: ${{ secrets.MONGODB_HOSTS }}
      MONGODB_USER: ${{ secrets.MONGODB_USER }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      MONGODB_REPLICA_SET: ${{ secrets.MONGODB_REPLICA_SET }}
      MONGODB_AUTH_SOURCE: ${{ secrets.MONGODB_AUTH_SOURCE }}
      MONGODB_TLS: ${{ secrets.MONGODB_TLS }}
      MONGO_ENV: ${{ vars.MONGO_ENV || inputs.environment }}
      # E-mail de recuperação de senha (getEmailService: Gmail > console).
      # FRONTEND_URL é o domínio do MintlyWeb deployado — sem isso, o link do
      # e-mail aponta pro default de dev (localhost:4200).
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      # Allowlist do CORS (P4): CSV com as origens do MintlyWeb. Sem ela o
      # servidor nega toda origem de navegador e o front perde a API. No EC2 o
      # processo herda o env do serviço (pm2/systemd) — mantenha o secret em dia.
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # production deploya o código da branch main.
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.11.0

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Validate Swagger
        run: npm run validate:swagger

      # Índices idempotentes antes do deploy (mesmo run/aprovação do deploy).
      - name: Ensure DB indexes
        run: npm run db:indices

      - name: Create deployment archive
        run: tar -czf mintly-api-deploy.tgz dist package.json package-lock.json

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$AWS_EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload deployment package
        run: scp mintly-api-deploy.tgz "$AWS_EC2_USER@$AWS_EC2_HOST:/tmp/mintly-api-deploy.tgz"

      - name: Deploy on EC2 instance
        run: |
          ssh "$AWS_EC2_USER@$AWS_EC2_HOST" <<EOF
            set -e
            mkdir -p "$AWS_APP_DIR"
            tar -xzf /tmp/mintly-api-deploy.tgz -C "$AWS_APP_DIR"
            cd "$AWS_APP_DIR"
            npm ci --omit=dev
            if command -v pm2 >/dev/null 2>&1; then
              pm2 describe "$AWS_PROCESS_NAME" >/dev/null 2>&1 && pm2 restart "$AWS_PROCESS_NAME" --update-env || pm2 start dist/server.js --name "$AWS_PROCESS_NAME"
            elif command -v systemctl >/dev/null 2>&1; then
              sudo systemctl restart "$AWS_PROCESS_NAME"
            else
              pkill -f "node dist/server.js" || true
              nohup node dist/server.js > /tmp/"$AWS_PROCESS_NAME".log 2>&1 &
            fi
          EOF
